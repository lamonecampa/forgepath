name: Build PHP WebAssembly runtime

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/php-runtime/**'
      - 'assets/clang/**'
      - 'assets/csharp-runtime/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forgepath-php-runtime
  cancel-in-progress: true

jobs:
  build-php-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ForgePath
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build PHP WebAssembly assets
        run: npm run build:php
      - name: Build C/C++ Clang WebAssembly assets
        run: npm run build:clang
      - name: Build C# WebAssembly playground
        run: npm run build:csharp
      - name: Commit generated runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/php-runtime assets/clang assets/csharp-runtime assets/csharp-playground.js
          if git diff --cached --quiet; then
            echo "No generated runtime changes."
          else
            git commit -m "Build browser language runtime assets"
            git push origin main
          fi
